[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "powerbi-modeling-mcp-proxy"
version = "0.1.0"
description = "XMLA readiness proxy for powerbi-modeling-mcp — adds warm-up detection and multi-instance disambiguation"
readme = "PROXY_README.md"
requires-python = ">=3.10"
dependencies = []  # pure stdlib — no extra installs needed

[project.scripts]
pbi-mcp-proxy = "proxy.proxy_server:main"
pbi-mcp-validate = "validate_xmla:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
